<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art cottage favicon, simplified from the village's cottage
       sprite (public/sprites/cottage.webp) down to a 16x16 grid so it
       stays legible at browser-tab sizes. shape-rendering=crispEdges keeps
       every edge sharp instead of anti-aliased at small scales. -->

  <!-- sky -->
  <rect width="16" height="16" fill="#8ec9f7"/>

  <!-- grass -->
  <rect x="0" y="13" width="16" height="3" fill="#6fa832"/>
  <rect x="0" y="12" width="5" height="1" fill="#6fa832"/>
  <rect x="11" y="12" width="5" height="1" fill="#6fa832"/>

  <!-- stone foundation -->
  <rect x="5" y="12" width="6" height="1" fill="#5a3a28"/>

  <!-- chimney smoke -->
  <rect x="11" y="0" width="1" height="1" fill="#f4f4f4"/>

  <!-- chimney -->
  <rect x="11" y="1" width="1" height="5" fill="#9aa0a6"/>

  <!-- roof -->
  <rect x="7" y="3" width="2" height="1" fill="#d9432c"/>
  <rect x="6" y="4" width="4" height="1" fill="#d9432c"/>
  <rect x="5" y="5" width="6" height="1" fill="#d9432c"/>
  <rect x="4" y="6" width="8" height="1" fill="#d9432c"/>
  <rect x="4" y="7" width="8" height="1" fill="#a82f1d"/>

  <!-- walls -->
  <rect x="5" y="8" width="6" height="4" fill="#fdf3df"/>

  <!-- window glow -->
  <rect x="9" y="9" width="1" height="1" fill="#fbbf24"/>

  <!-- door -->
  <rect x="7" y="10" width="2" height="2" fill="#6b4226"/>
</svg>
